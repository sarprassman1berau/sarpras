<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal GTK · SMAN 1 Berau</title>
<meta name="description" content="Usulan RKAS dan jadwal Aula & Multimedia untuk guru dan tenaga kependidikan SMA Negeri 1 Berau">
<link rel="icon" type="image/png" href="data/logo-sekolah.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f6f7f5; --surface:#ffffff; --sunk:#eef0ec; --line:#d9ddd6; --line-strong:#b9bfb4;
  --fg:#1d2420; --muted:#5d675f; --faint:#8a938b;
  --accent:#1e5a4c; --accent-fg:#ffffff; --accent-soft:#e1eee9;
  --ok:#2f7a45; --ok-soft:#e3f1e6; --warn:#9a6a0b; --warn-soft:#f8eed6; --bad:#a6362b; --bad-soft:#f7e1dd; --info:#2d5d8a; --info-soft:#e2ecf6;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131815; --surface:#1a201c; --sunk:#202823; --line:#2e3832; --line-strong:#44514a; --fg:#e4e9e5; --muted:#a3ada6; --faint:#7d877f;
  --accent:#6fc2a9; --accent-fg:#0e1a15; --accent-soft:#1f3a32; --ok:#7cc591; --ok-soft:#1d3324; --warn:#e2b45a; --warn-soft:#3a2f17; --bad:#ec8b7f; --bad-soft:#3d221e; --info:#8db8e0; --info-soft:#1c2b3a;
}}
:root[data-theme="dark"]{--bg:#131815; --surface:#1a201c; --sunk:#202823; --line:#2e3832; --fg:#e4e9e5; --muted:#a3ada6; --accent:#6fc2a9; --accent-fg:#0e1a15; --accent-soft:#1f3a32}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header img{width:42px;height:42px}
header .t{border-left:3px solid var(--accent);padding-left:10px}
header .t small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
header .t b{font-family:var(--f-head);font-size:20px}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{font-family:var(--f-head);font-size:22px;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:8px 14px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea,button{font:inherit;color:var(--fg)}
input,select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
button{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;color:var(--accent);padding:4px 8px}
button:disabled{opacity:.55;cursor:not-allowed}
.hint{font-size:12px;color:var(--faint);font-weight:400}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.sug{display:grid;gap:4px;margin-top:6px;max-height:300px;overflow:auto}
.sug button{display:flex;justify-content:space-between;gap:10px;text-align:left;align-items:flex-start}
.sug small{color:var(--faint)}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .m{flex:1;min-width:200px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)}
.week{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.week th,.week td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.week th{font-size:13px;width:110px}
.week tr.today{background:var(--accent-soft)}
.bk{border-left:3px solid var(--ok);padding:2px 0 2px 8px;margin-bottom:6px;font-size:13px}
.bk.wait{border-color:var(--warn)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw;z-index:10}
@media (max-width:640px){.grid{grid-template-columns:1fr}.week th{width:80px}}
</style>
</head>
<body>
<header><img src="data/logo-sekolah.png" alt="Logo SMA Negeri 1 Berau"><div class="t"><small>SMA Negeri 1 Berau</small><b>Portal GTK</b></div></header>
<main id="app"><p class="muted">Memuat…</p></main>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Portal GTK: halaman terpisah dari aplikasi sarpras. Masuk tanpa akun (login anonim Firebase) + kode GTK sekolah.
const FB_CONFIG = { apiKey:"AIzaSyDnfzqtHG22tnUQrpKxThh3-y4-aZrx5_c", authDomain:"sarpras-sman1berau.firebaseapp.com", projectId:"sarpras-sman1berau", storageBucket:"sarpras-sman1berau.firebasestorage.app", messagingSenderId:"499206674411", appId:"1:499206674411:web:2cecdfa79945cc426debae" };
const SD = [["BOSNAS", "BOSP Reguler (BOSNAS)"], ["BOSDA", "BOSP Daerah (BOSDA)"], ["KOMITE", "Dana Komite"], ["LAIN", "Belum ditentukan / lainnya"]];
const BIDANG = ["Kurikulum", "Kesiswaan", "Humas", "Sarpras", "Tata Usaha", "Perpustakaan", "Laboratorium", "Lainnya"];
const RUANG = [["aula", "Aula"], ["mm", "Ruang Multimedia"]];
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"], BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const ST = { Diajukan:"warn", Revisi:"info", Disetujui:"ok", Ditolak:"bad" };
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const rp = n => "Rp" + Math.round(+n || 0).toLocaleString("id-ID"), fmt = n => (+n || 0).toLocaleString("id-ID");
const norm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim(), words = s => norm(s).split(" ").filter(Boolean);
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const tglID = s => { if (!s) return ""; const [y, m, d] = String(s).split("-"); return (+d) + " " + BULAN[+m - 1] + " " + y; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const toast = t => { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = "none", 3500); };
const thNow = new Date().getFullYear();
const S = { uid:null, ready:false, info:null, mine:[], pinjam:[], err:"", sh:null, shLoading:false };
const U = { tab:store.get("gtk.tab", "usul"), me:store.get("gtk.me", { nama:"", bidang:"", kode:"" }), f:null, week:0, busy:false, confirm:null };
const blank = () => ({ id:"", th:String(thNow + (new Date().getMonth() >= 6 ? 1 : 0)), sd:"BOSNAS", uraian:"", spek:"", vol:"", satuan:"", harga:"", rek:"", output:"", cari:"" });
U.f = blank();

firebase.initializeApp(FB_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
auth.onAuthStateChanged(u => {
  if (!u) { auth.signInAnonymously().catch(e => { S.err = e.code === "auth/operation-not-allowed" || e.code === "auth/admin-restricted-operation" ? "Portal GTK belum diaktifkan oleh admin (login Anonymous di Firebase belum dinyalakan)." : "Gagal terhubung: " + (e.message || e); render(); }); return; }
  S.uid = u.uid; S.ready = true;
  db.doc("gtk_pub/info").onSnapshot(d => { S.info = d.exists ? d.data() : {}; render(); }, e => { S.err = "Portal GTK belum siap (aturan Firestore belum diperbarui)."; render(); });
  db.collection("keu_gtk").where("by", "==", u.uid).onSnapshot(q => { S.mine = q.docs.map(d => Object.assign({ _id:d.id }, d.data())).sort((a, b) => String(b.at).localeCompare(String(a.at))); render(); }, () => {});
  db.collection("pinjam").onSnapshot(q => { S.pinjam = q.docs.map(d => Object.assign({ _id:d.id }, d.data())); render(); }, () => {});
  render();
});
function shLoad() {
  if (S.sh || S.shLoading) return; S.shLoading = true;
  fetch("data/standar-harga.json").then(r => r.json()).then(d => { const R = i => d.rl[i] || ""; S.sh = [...d.katalog.map(r => ({ t:"Katalog", nama:r[1], spek:r[2], sat:r[3], harga:r[4], rek:R(r[5]) })), ...d.ssh.map(r => ({ t:"SSH", nama:r[0], spek:r[1], sat:r[2], harga:r[3], rek:R(r[4]) })), ...d.sbu.map(r => ({ t:"SBU", nama:r[0], spek:r[1], sat:r[2], harga:r[3], rek:R(r[4]) }))]; S.sh.forEach(x => { x.h = norm(x.nama + " " + x.spek); x.n = norm(x.nama); }); render(); }).catch(() => { S.shLoading = false; });
}
function shFind(q) { const w = words(q); if (!S.sh || !w.length) return []; const a = [], b = []; for (const x of S.sh) { if (w.every(t => x.h.includes(t))) { (w.every(t => x.n.includes(t)) ? a : b).push(x); if (a.length >= 12) break; } } return [...a, ...b].slice(0, 12); }

function render() {
  const ae = document.activeElement, fid = ae && ae.id, pos = (() => { try { return ae.selectionStart; } catch (e) { return null; } })();
  $("#app").innerHTML = view();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll:true }); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}
function view() {
  if (S.err) return `<div class="note bad">${esc(S.err)}</div><p class="muted">Hubungi Waka Sarpras / admin aplikasi.</p>`;
  if (!S.ready || !S.info) return `<p class="muted">Menghubungkan…</p>`;
  const tabs = `<div class="tabs" role="tablist">${[["usul", "Usulan RKAS"], ["jadwal", "Jadwal Aula & Multimedia"]].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-pressed="${U.tab === k}">${l}</button>`).join("")}</div>`;
  return `<h2>Halo${U.me.nama ? ", " + esc(U.me.nama.split(",")[0]) : ""}</h2><p class="lead">Portal untuk guru dan tenaga kependidikan: usulkan kebutuhan untuk RKAS dan lihat jadwal penggunaan Aula & Ruang Multimedia.</p>${tabs}${U.tab === "jadwal" ? vJadwal() : vUsul()}`;
}
function vUsul() {
  const me = U.me, f = U.f, peg = (S.info.pegawai || []), ok = me.nama && me.bidang && me.kode;
  shLoad();
  const idPanel = `<section class="panel"><h3 style="margin:0 0 8px">Identitas pengusul</h3><div class="grid">
    <label>Nama<input id="me-nama" list="dl-peg" value="${esc(me.nama)}" placeholder="ketik lalu pilih nama Anda"><datalist id="dl-peg">${peg.map(p => `<option value="${esc(p.nama)}">${esc(p.jab || "")}</option>`).join("")}</datalist></label>
    <label>Bidang / unit<select id="me-bidang"><option value="">— pilih —</option>${BIDANG.map(b => `<option ${me.bidang === b ? "selected" : ""}>${b}</option>`).join("")}</select></label>
    <label class="full">Kode GTK<input id="me-kode" value="${esc(me.kode)}" placeholder="kode dari Waka Sarpras / admin" autocomplete="off"><span class="hint">Kode tersimpan di perangkat ini, cukup diisi sekali.</span></label></div></section>`;
  const sug = words(f.cari).length ? (S.sh ? (shFind(f.cari).map((x, i) => `<button type="button" data-pick="${i}"><span><b>${esc(x.nama)}</b> <span class="pill">${x.t}</span><br><small>${esc(x.spek)}</small></span><span class="num">${rp(x.harga)}<br><small>/ ${esc(x.sat)}</small></span></button>`).join("") || `<p class="hint">Tidak ditemukan di standar harga. Isi manual di bawah.</p>`) : `<p class="hint">Memuat standar harga…</p>`) : "";
  const form = `<section class="panel"><h3 style="margin:0 0 8px">${f.id ? "Ubah usulan" : "Tambah usulan"}</h3>
    <label>Cari di standar harga<input id="f-cari" type="search" value="${esc(f.cari)}" placeholder="mis. kertas HVS, spidol, sewa sound system"></label><div class="sug">${sug}</div>
    <div class="grid" style="margin-top:10px">
      <label class="full">Nama barang / jasa<input id="f-uraian" value="${esc(f.uraian)}"></label>
      <label class="full">Spesifikasi<input id="f-spek" value="${esc(f.spek)}"></label>
      <label>Jumlah (volume)<input id="f-vol" type="number" min="0" step="any" inputmode="decimal" value="${esc(f.vol)}"></label>
      <label>Satuan<input id="f-satuan" value="${esc(f.satuan)}" placeholder="Rim, Buah, Paket"></label>
      <label>Perkiraan harga satuan (Rp)<input id="f-harga" type="number" min="0" step="any" inputmode="numeric" value="${esc(f.harga)}"></label>
      <label>Tahun anggaran<select id="f-th">${[thNow, thNow + 1].map(y => `<option ${f.th === String(y) ? "selected" : ""}>${y}</option>`).join("")}</select></label>
      <label>Usulan sumber dana<select id="f-sd">${SD.map(([k, l]) => `<option value="${k}" ${f.sd === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Kode rekening<input id="f-rek" value="${esc(f.rek)}" placeholder="terisi otomatis dari standar harga"></label>
      <label class="full">Keterangan: menunjang kegiatan/aktivitas apa? <span style="color:var(--bad)">*</span><textarea id="f-output" rows="2" placeholder="mis. Praktikum kimia kelas XI semester genap; Ujian sekolah; Administrasi kelas">${esc(f.output)}</textarea></label></div>
    <p style="margin:10px 0"><b id="f-total">Jumlah: ${rp((+f.vol || 0) * (+f.harga || 0))}</b></p>
    <div class="bar"><button class="primary" id="f-kirim" ${ok && !U.busy ? "" : "disabled"}>${U.busy ? "Mengirim…" : f.id ? "Simpan perubahan" : "Kirim usulan"}</button>${f.id ? '<button id="f-batal">Batal ubah</button>' : ""}${ok ? "" : '<span class="hint">Lengkapi identitas pengusul dulu.</span>'}</div></section>`;
  const mine = S.mine;
  const list = `<section class="panel"><h3 style="margin:0 0 4px">Usulan saya</h3><p class="hint" style="margin:0 0 6px">Daftar ini tersimpan untuk perangkat/browser ini. Status diperbarui otomatis setelah diasistensi tim RKAS.</p>
    ${mine.map(u => `<div class="item"><div class="m"><b>${esc(u.uraian)}</b> <span class="pill ${ST[u.st] || ""}">${esc(u.st)}</span><div class="hint">${esc(u.spek || "")}${u.output ? " · " + esc(u.output) : ""}</div>${u.catatan ? `<div style="color:var(--info);font-size:13px">Catatan tim RKAS: ${esc(u.catatan)}</div>` : ""}<div class="hint">${esc(u.th)} · ${esc(u.sd)} · ${esc(u.nama)}</div></div><div class="num">${fmt(u.vol)} ${esc(u.satuan)} × ${rp(u.harga)}<br><b>${rp((+u.vol || 0) * (+u.harga || 0))}</b></div>
      ${u.st !== "Disetujui" ? `<div style="width:100%;display:flex;gap:6px;justify-content:flex-end"><button class="ghost" data-edit="${esc(u._id)}">Ubah</button>${U.confirm === u._id ? `<button class="ghost" data-delok="${esc(u._id)}" style="color:var(--bad)">Ya, hapus</button><button class="ghost" data-delno="1">Batal</button>` : `<button class="ghost" data-del="${esc(u._id)}">Hapus</button>`}</div>` : ""}</div>`).join("") || '<p class="muted">Belum ada usulan dari perangkat ini.</p>'}
    ${mine.length ? `<p style="text-align:right;margin:8px 0 0"><b>Total: ${rp(mine.reduce((t, u) => t + (+u.vol || 0) * (+u.harga || 0), 0))}</b></p>` : ""}</section>`;
  return idPanel + form + list;
}
function vJadwal() {
  const base = new Date(); base.setHours(12, 0, 0, 0); const mon = new Date(base); mon.setDate(base.getDate() - ((base.getDay() + 6) % 7) + U.week * 7);
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; }), td = ymd(new Date());
  const cell = (r, d) => { const b = S.pinjam.filter(x => x.ruang === r && x.tgl === ymd(d) && (x.st === "Disetujui" || x.st === "Diajukan")).sort((a, c) => String(a.mulai).localeCompare(String(c.mulai)));
    return `<td>${b.map(x => `<div class="bk ${x.st === "Disetujui" ? "" : "wait"}"><b>${esc(x.mulai)}–${esc(x.selesai)}</b> ${esc(x.kegiatan)}<div class="hint">${esc(x.unit || "")}${x.st !== "Disetujui" ? " · menunggu persetujuan" : ""}</div></div>`).join("") || '<span class="hint">kosong</span>'}</td>`; };
  return `<div class="bar"><button data-wk="-1">‹ Minggu lalu</button><b>${tglID(ymd(days[0]))} – ${tglID(ymd(days[6]))}</b><button data-wk="1">Minggu depan ›</button>${U.week ? '<button class="ghost" data-wk="0">Minggu ini</button>' : ""}</div>
  <p class="hint" style="margin:0 0 8px"><span class="pill ok">garis hijau</span> disetujui · <span class="pill warn">garis kuning</span> menunggu persetujuan. Pengajuan pemakaian ruang dilakukan melalui aplikasi sekolah oleh akun yang berwenang.</p>
  <div style="overflow:auto"><table class="week"><thead><tr><th>Hari</th>${RUANG.map(r => `<th style="width:auto">${r[1]}</th>`).join("")}</tr></thead><tbody>${days.map(d => `<tr class="${ymd(d) === td ? "today" : ""}"><th><b>${HARI[d.getDay()]}</b><div class="hint">${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)}</div></th>${RUANG.map(r => cell(r[0], d)).join("")}</tr>`).join("")}</tbody></table></div>`;
}
document.addEventListener("input", e => {
  const t = e.target, f = U.f;
  if (t.id === "f-cari") { f.cari = t.value; render(); return; }
  if (t.id && t.id.startsWith("f-")) { f[t.id.slice(2)] = t.value; if (t.id === "f-vol" || t.id === "f-harga") { const b = document.getElementById("f-total"); if (b) b.textContent = "Jumlah: " + rp((+f.vol || 0) * (+f.harga || 0)); } return; }
  if (t.id === "me-nama" || t.id === "me-kode") { U.me[t.id.slice(3)] = t.value.trim() ? t.value : ""; store.set("gtk.me", U.me); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "me-bidang") { U.me.bidang = t.value; store.set("gtk.me", U.me); render(); }
  if (t.id === "me-nama" || t.id === "me-kode") render();
  if (t.id === "f-th" || t.id === "f-sd") U.f[t.id.slice(2)] = t.value;
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset, f = U.f;
  if (d.tab) { U.tab = d.tab; store.set("gtk.tab", U.tab); render(); }
  if (d.wk != null) { U.week = d.wk === "0" ? 0 : U.week + +d.wk; render(); }
  if (d.pick != null) { const x = shFind(f.cari)[+d.pick]; if (x) Object.assign(f, { uraian:x.nama, spek:x.spek, satuan:x.sat, harga:x.harga, rek:String(x.rek || "").split(",")[0], cari:"" }); render(); }
  if (b.id === "f-batal") { U.f = blank(); render(); }
  if (d.edit) { const u = S.mine.find(x => x._id === d.edit); if (u) { U.f = Object.assign(blank(), u, { id:u._id, cari:"" }); window.scrollTo(0, 0); render(); } }
  if (d.del) { U.confirm = d.del; render(); }
  if (d.delno) { U.confirm = null; render(); }
  if (d.delok) { U.confirm = null; try { await db.doc("keu_gtk/" + d.delok).delete(); toast("Usulan dihapus."); } catch (err) { toast("Gagal menghapus."); } }
  if (b.id === "f-kirim") {
    const me = U.me;
    if (!f.uraian.trim() || !(+f.vol > 0) || !(+f.harga > 0)) { toast("Isi nama barang/jasa, jumlah, dan perkiraan harga."); return; }
    if (!f.output.trim()) { toast("Isi keterangan: usulan ini menunjang kegiatan apa."); return; }
    const id = f.id || "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), old = f.id && S.mine.find(x => x._id === f.id);
    U.busy = true; render();
    try {
      await db.doc("keu_gtk/" + id).set({ th:f.th, sd:f.sd, bidang:me.bidang, uraian:f.uraian.trim().slice(0, 280), spek:String(f.spek || "").trim().slice(0, 400), vol:+f.vol, satuan:String(f.satuan || "").trim().slice(0, 40), harga:+f.harga, rek:String(f.rek || "").trim().slice(0, 60), output:f.output.trim().slice(0, 500), nama:me.nama.trim().slice(0, 120), by:S.uid, st:"Diajukan", catatan:"", kode:me.kode.trim(), portal:true, at:old ? old.at : new Date().toISOString() });
      toast(f.id ? "Usulan diperbarui." : "Usulan terkirim ke tim RKAS."); U.f = Object.assign(blank(), { th:f.th, sd:f.sd });
    } catch (err) { toast(err && err.code === "permission-denied" ? "Kode GTK salah atau usulan sudah disetujui. Periksa kode GTK." : "Gagal mengirim. Periksa koneksi."); }
    U.busy = false; render();
  }
});
render();
</script>

</html>
